name: Release

# Publishing is driven by the tag, so the released binary and the version
# it reports cannot disagree: the -Version stamp is taken from the tag
# name itself rather than from a constant someone has to remember to bump.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.inputs.tag }}') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          # v0.1.0 -> 0.1.0; `goop version` reports the number, the tag carries the v.
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "building $version from $tag"

      # Same script contributors use, so a release binary is produced the
      # one way that is tested, not by a second copy of the build steps.
      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -Version '${{ steps.version.outputs.version }}'

      # A release that does not pass its own tests should not exist.
      - name: Vet and test
        shell: pwsh
        run: |
          go vet ./...
          go test ./...

      # Prove the artifact reports the version it was tagged with before
      # it is published, rather than discovering a mis-stamped binary
      # after people have downloaded it.
      - name: Verify the stamp
        shell: pwsh
        run: |
          # @(...) forces array context: a single-line output would be a
          # string, and $out[0] its first character rather than its first
          # line -- failing the check for entirely the wrong reason.
          $out = @(& .\build\goop.exe version)
          Write-Output $out
          $expected = 'goop ${{ steps.version.outputs.version }}'
          if ($out[0] -ne $expected) {
            throw "version output is '$($out[0])', expected '$expected'"
          }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\build\goop.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  goop.exe" | Out-File -FilePath .\build\checksums.txt -Encoding ascii
          Get-Content .\build\checksums.txt

      # Notes are built as an indented array rather than a here-string or
      # a multi-line --notes argument: inside a `run: |` block every line
      # must stay indented, and a line starting at column 0 silently ends
      # the block and makes the whole workflow file unparseable.
      # The offline bundle: everything needed to install goop on a machine
      # with no network at all. Without the bucket it would install but be
      # unable to install anything, which is not much use.
      - name: Assemble the offline bundle
        shell: pwsh
        run: |
          $stage = 'build\offline'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\goop.exe      $stage
          Copy-Item build\checksums.txt $stage
          Copy-Item scripts\install.ps1 $stage

          # A codeload snapshot rather than a clone: the bundle must not
          # assume git exists on the machine that unpacks it.
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://codeload.github.com/ScoopInstaller/Main/zip/HEAD' `
            -OutFile (Join-Path $stage 'main-bucket.zip')

          $readme = @(
            'goop ${{ steps.version.outputs.version }} -- offline bundle',
            '',
            'Everything needed to install goop with no network access:',
            'goop.exe, its checksum, the installer, and a snapshot of the',
            'main bucket so packages can actually be installed afterwards.',
            '',
            'Unpack anywhere, then from that directory run:',
            '',
            '    .\install.ps1',
            '',
            'It finds goop.exe next to itself, verifies its checksum, and',
            'seeds the main bucket from main-bucket.zip. The bucket is still',
            'recorded under its real URL, so `goop bucket update` works',
            'normally once the machine has a network again.',
            '',
            'Options: -GoopDir <path> to install elsewhere, -NoBucket to',
            'skip the bucket, -DryRun to see what would change.',
            '',
            'Packages themselves still need to come from somewhere. Copy a',
            'populated cache directory across, or point manifests at a',
            'local share -- see the README section "Offline and restricted',
            'networks".'
          )
          Set-Content -Path (Join-Path $stage 'README.txt') -Value $readme -Encoding utf8

          $zip = "build\goop-${{ steps.version.outputs.version }}-offline.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          "offline_zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "bundle: $((Get-Item $zip).Length / 1MB) MB"
        id: bundle

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lines = @(
            'Install:',
            '',
            '```powershell',
            'irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex',
            '```',
            '',
            'Needs no Go toolchain and no git. See CHANGELOG.md for what changed;',
            '`goop version` reports the build you are running.'
          )
          Set-Content -Path release-notes.md -Value $lines -Encoding utf8
          gh release create '${{ steps.version.outputs.tag }}' build\goop.exe build\checksums.txt '${{ steps.bundle.outputs.offline_zip }}' --title 'goop ${{ steps.version.outputs.version }}' --notes-file release-notes.md --verify-tag
